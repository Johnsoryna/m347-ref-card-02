name: Docker CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/app-refcard-02
  GHCR_IMAGE: ghcr.io/johnsoryna/app-refcard-02

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t app-refcard-02 .

      - name: Test image
        run: |
          docker run -d --name test -p 8080:80 app-refcard-02
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080 > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080 | grep "React App"
          docker rm -f test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker tag app-refcard-02 $IMAGE:latest
          docker tag app-refcard-02 $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Registry
        run: |
          docker tag app-refcard-02 $GHCR_IMAGE:latest
          docker tag app-refcard-02 $GHCR_IMAGE:${{ github.sha }}
          docker push $GHCR_IMAGE:latest
          docker push $GHCR_IMAGE:${{ github.sha }}
